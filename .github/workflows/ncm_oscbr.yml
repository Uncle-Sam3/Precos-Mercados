name: NCM por EAN — OSCBR
on:
  schedule: [{cron: "41 10 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: ncm-ean, cancel-in-progress: false}
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OSCBR_USER: ${{ secrets.OSCBR_USER }}
      OSCBR_PASS: ${{ secrets.OSCBR_PASS }}
    steps:
      - name: Segredos presentes?
        id: s
        run: if [ -n "$OSCBR_USER" ] && [ -n "$OSCBR_PASS" ]; then echo ok=1 >> $GITHUB_OUTPUT; else echo "::notice::Segredo(s) ausente(s) — pulando sem erro."; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == '1'
      - uses: actions/setup-python@v5
        if: steps.s.outputs.ok == '1'
        with: {python-version: '3.12'}
      - if: steps.s.outputs.ok == '1'
        run: pip install requests && python collector/ncm_oscbr.py
      - name: Salvar resultado
        if: steps.s.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/ncm_ean.json collector/ref/*.json
          git diff --cached --quiet && exit 0
          git commit -m "NCM por EAN (oscbr): $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*7)); done; exit 1
